name: szr-codeguard
profile: startup

targets:
  - name: repository
    path: .
    language: go
    entrypoints:
      - cmd/szr
      - cmd/szr-dev

checks:
  quality: true
  design: false
  security: true
  prompts: true
  ci: false

  quality_rules:
    max_file_lines: 400
    max_function_lines: 9999
    max_parameters: 999
    max_cyclomatic_complexity: 15

  security_rules:
    govulncheck_mode: auto
    govulncheck_command: govulncheck

  prompt_rules:
    file_extensions:
      - .md
      - .txt
      - .tmpl
      - .yaml
      - .yml
      - .json
    path_contains:
      - prompt
      - system
      - instruction
      - template
    forbid_secret_interpolation: true
    forbid_unsafe_instructions: true

exclude:
  - vendor/**
  - '**/testdata/**'
  # Reproducible build products and local caches are not source code. Scanning
  # them duplicates findings and can surface stale third-party binaries.
  - .gocache/**
  - .gocache-docker/**
  - .cache/**
  - .gobin/**
  - .tmp*/**
  - bin/**
  - packaging/.staging/**
  - packaging/npm/dist/**

cache:
  enabled: true
  path: .codeguard/cache.json

baseline:
  path: codeguard-baseline.json

output:
  format: text
