name: ci.yml

on:
  pull_request:
    branches:
      - develop
      - master
      - main

permissions:
  contents: read
  pull-requests: read

env:
  GOCACHE: ${{ github.workspace }}/.gocache
  GO111MODULE: "on"
  GOLANGCI_LINT_VERSION: v2.12.2
  CODEGUARD_VERSION: v0.2.0
  MIN_INTERNAL_COVERAGE: "80.0"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Fast gates (fail early, save CI minutes) ───

  check-test-presence:
    name: test presence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 50

      - name: Check changed code paths have test coverage updates
        shell: bash
        env:
          PR_BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          git fetch origin "${PR_BASE_REF}" --depth=1 || true
          base_ref="origin/${PR_BASE_REF}"
          changed_files="$(git diff --name-only "${base_ref}"...HEAD)"

          # Ignore package-doc files so documentation-only Go changes do not
          # require unrelated test churn.
          code_changes="$(printf '%s\n' "$changed_files" | grep -E '^(cmd/|internal/|pkg/).+\.go$' | grep -Ev '(^|/).+_test\.go$|(^|/)doc\.go$' || true)"
          test_changes="$(printf '%s\n' "$changed_files" | grep -E '(^test/|_test\.go$)' || true)"

          if [ -z "$code_changes" ]; then
            echo "No Go source changes that require a test presence check."
            exit 0
          fi

          echo "Go source files changed:"
          printf '%s\n' "$code_changes"

          if [ -n "$test_changes" ]; then
            echo
            echo "Matching test updates detected:"
            printf '%s\n' "$test_changes"
            exit 0
          fi

          echo "::error title=Missing test update::Go source changed without any updates under test/ or *_test.go files"
          exit 1

  vet:
    name: vet
    needs:
      - check-test-presence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Run go vet
        run: go vet ./...

  golangci-lint:
    name: golangci-lint
    needs: vet
    runs-on: ubuntu-latest
    env:
      PR_BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Fetch base branch
        run: git fetch origin "${PR_BASE_REF}" --depth=1

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}

      - name: Enforce maintainability lint budget
        shell: bash
        run: |
          set -euo pipefail

          golangci_bin="$(go env GOPATH)/bin/golangci-lint"
          status=0

          if "$golangci_bin" run --config .golangci.yml --new-from-rev "origin/${PR_BASE_REF}" ./... 2>&1 | tee golangci.out; then
            status=0
          else
            status=$?
          fi

          {
            echo "## golangci-lint"
            echo
            if [ "$status" -eq 0 ]; then
              echo "No new maintainability lint issues detected."
            else
              echo "New maintainability lint issues detected:"
              echo '```'
              sed -n '1,80p' golangci.out
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$status" -ne 0 ]; then
            echo "::error title=Maintainability lint budget exceeded::golangci-lint reported new maintainability issues"
            exit "$status"
          fi

  # ─── Parallel gates (all need the code-quality gate first) ───

  test:
    name: test (${{ matrix.label }})
    needs:
      - vet
      - golangci-lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: ubuntu-latest full
            test_command: go test ./test/...
          - os: macos-latest
            label: macos-latest full
            test_command: go test ./test/...
          - os: windows-latest
            label: windows-latest smoke
            test_command: go test ./test/config ./test/filters/... ./test/installers ./test/profiles/... ./test/rules ./test/teeindex
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Run test suite
        run: ${{ matrix.test_command }}

  coverage:
    name: coverage
    needs:
      - vet
      - golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Enforce internal coverage gate
        shell: bash
        run: |
          set -euo pipefail

          go test ./test/... -coverpkg=./internal/... -coverprofile=.coverage.internal.out
          total="$(go tool cover -func=.coverage.internal.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')"

          {
            echo "## Coverage"
            echo
            echo "Total internal coverage: ${total}%"
            echo "Required minimum: ${MIN_INTERNAL_COVERAGE}%"
          } >> "$GITHUB_STEP_SUMMARY"

          awk -v total="$total" -v min="$MIN_INTERNAL_COVERAGE" 'BEGIN { exit !(total + 0 >= min + 0) }'

  smoke:
    name: smoke
    needs:
      - vet
      - golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Run smoke checks
        run: make smoke

  codeguard:
    name: codeguard
    needs:
      - vet
      - golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Install govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run Devr Codeguard
        uses: devr-tools/codeguard@v1.3.9
        with:
          config: codeguard.yaml
          mode: diff
          base-ref: origin/${{ github.base_ref }}
          format: github
          version: ${{ env.CODEGUARD_VERSION }}

  benchmark:
    name: benchmark
    needs:
      - vet
      - golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Run Go benchmarks
        shell: bash
        run: |
          set -euo pipefail

          go test ./test/bench -run '^$' -bench . -benchmem | tee bench.txt

          {
            echo "## Benchmarks"
            echo
            echo '```'
            sed -n '1,80p' bench.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run reducer fixture benchmark smoke
        shell: bash
        run: |
          set -euo pipefail

          go run ./cmd/szr bench --json clean-pass | tee bench-fixture.json >/dev/null

          {
            echo
            echo "### Fixture Benchmark Smoke"
            echo '```json'
            sed -n '1,40p' bench-fixture.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ─── Documentation / policy gates ───

  doc-review:
    name: doc review
    if: github.base_ref == 'develop'
    needs:
      - vet
    runs-on: ubuntu-latest
    env:
      PR_BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch origin "${PR_BASE_REF}" --depth=1

      - name: Check doc-sensitive changes have doc updates
        shell: bash
        run: |
          set -euo pipefail

          changed="$(git diff --name-only "origin/${PR_BASE_REF}"...HEAD)"
          ci_cd_only="$(printf '%s\n' "$changed" | grep -E '^(\.github/workflows/|\.github/release-please-config\.json$|\.release-please-manifest\.json$)' || true)"
          doc_sensitive="$(printf '%s\n' "$changed" | grep -E '^(\.goreleaser\.yaml$|Formula/|internal/installers/|internal/selfinstall/|README\.md$|docs/)' || true)"
          docs_changed="$(printf '%s\n' "$changed" | grep -E '^(README\.md|CONTRIBUTING\.md|docs/)' || true)"

          echo "## Documentation Review" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"

          if [ -z "$doc_sensitive" ]; then
            if [ -n "$ci_cd_only" ]; then
              echo "Only CI/CD automation files changed. Documentation updates are not required for this PR." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "No install or release changes that require documentation review." >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi

          echo "Doc-sensitive files changed:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$doc_sensitive" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$docs_changed" ]; then
            echo "Relevant documentation files were updated:" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n' "$docs_changed" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "::error::Install or release changes require updates in README.md, CONTRIBUTING.md, or docs/"
          exit 1

  dco:
    name: dco
    if: github.base_ref == 'develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify Signed-off-by trailers
        shell: bash
        run: |
          set -euo pipefail

          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          missing=0

          while IFS= read -r commit; do
            [ -n "$commit" ] || continue

            if ! git show -s --format=%B "$commit" | grep -qi '^Signed-off-by:'; then
              echo "::error title=DCO check failed::commit $commit is missing a Signed-off-by trailer"
              missing=1
            fi
          done < <(git rev-list "${base_sha}..${head_sha}")

          exit "$missing"
