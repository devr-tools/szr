name: ci

on:
  pull_request:
    branches:
      - develop
      - master
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify formatting
        shell: bash
        run: |
          set -euo pipefail
          make fmt
          git diff --exit-code

  vet:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run go vet
        run: go vet ./...

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run test suite
        run: go test ./test/...

  coverage:
    runs-on: ubuntu-latest
    env:
      MIN_INTERNAL_COVERAGE: "80.0"
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Enforce internal coverage gate
        shell: bash
        run: |
          set -euo pipefail

          env GOCACHE="$PWD/.gocache" go test ./test/... -coverpkg=./internal/... -coverprofile=.coverage.internal.out
          total="$(env GOCACHE="$PWD/.gocache" go tool cover -func=.coverage.internal.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')"

          echo "total internal coverage: ${total}%"

          awk -v total="$total" -v min="$MIN_INTERNAL_COVERAGE" 'BEGIN { exit !(total + 0 >= min + 0) }'

  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run smoke checks
        run: make smoke

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Scan dependencies and code
        shell: bash
        run: |
          set -euo pipefail
          "$(go env GOPATH)/bin/govulncheck" ./...

  dco:
    if: github.base_ref == 'develop'
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify Signed-off-by trailers
        shell: bash
        run: |
          set -euo pipefail

          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          missing=0

          while IFS= read -r commit; do
            [ -n "$commit" ] || continue

            if ! git show -s --format=%B "$commit" | grep -qi '^Signed-off-by:'; then
              echo "::error title=DCO check failed::commit $commit is missing a Signed-off-by trailer"
              missing=1
            fi
          done < <(git rev-list "${base_sha}..${head_sha}")

          exit "$missing"
