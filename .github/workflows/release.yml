name: release.yml

on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      tag:
        description: Release tag to build from.
        required: true
        type: string
      prerelease:
        description: Whether this release should stay in the prerelease channel.
        required: true
        type: boolean
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or publish.
        required: true
        type: string
      prerelease:
        description: Mark the release as a prerelease.
        required: true
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.release.outputs.prerelease }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Resolve release context
        id: release
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF_NAME}"
            if [[ "$tag" == *-* ]]; then
              prerelease="true"
            else
              prerelease="false"
            fi
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            raw_tag="${{ github.event.inputs.tag }}"
            prerelease="${{ github.event.inputs.prerelease }}"
          else
            raw_tag="${{ inputs.tag }}"
            prerelease="${{ inputs.prerelease }}"

            # Reusable callers already pass normalized tags, but keep the same
            # manual-input cleanup here so both entry points behave the same.
          fi

          if [ "${{ github.event_name }}" != "push" ]; then
            tag="$(printf '%s' "$raw_tag" | tr -d '[:space:]')"
            tag="${tag#refs/tags/}"
            tag="${tag#tag=}"
            tag="${tag##*:}"

            if [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              tag="v$tag"
            fi
          fi

          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >>"$GITHUB_OUTPUT"

      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ steps.release.outputs.tag }}"
          prerelease="${{ steps.release.outputs.prerelease }}"

          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "tag must look like v1.2.3 or v1.2.3-rc.4"
            echo "received: '$tag'"
            exit 1
          fi

          if [ "$prerelease" = "true" ] && [[ "$tag" != *-* ]]; then
            echo "prerelease tags must include a prerelease suffix, for example -rc.4"
            exit 1
          fi

          if [ "$prerelease" != "true" ] && [[ "$tag" == *-* ]]; then
            echo "stable releases must use a stable semantic version tag"
            exit 1
          fi

      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Ensure requested tag exists
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ steps.release.outputs.tag }}"

          git fetch --tags --force

          if git rev-parse "$tag" >/dev/null 2>&1; then
            :
          elif git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            git fetch origin "refs/tags/$tag:refs/tags/$tag"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "Release $tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
          fi

          git checkout "$tag"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --config .goreleaser.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release bundle
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ steps.release.outputs.tag }}
          path: dist/*

  sync-homebrew-formula:
    needs: build-release
    if: needs.build-release.outputs.prerelease != 'true'
    runs-on: ubuntu-latest
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Detect release bot token
        id: release_token
        shell: bash
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_PLEASE_TOKEN" ]; then
            echo "available=false" >>"$GITHUB_OUTPUT"
          else
            echo "available=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Check out default branch with release bot token
        if: steps.release_token.outputs.available == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ env.DEFAULT_BRANCH }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          fetch-depth: 0

      - name: Check out default branch with default token
        if: steps.release_token.outputs.available != 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ env.DEFAULT_BRANCH }}
          fetch-depth: 0

      - name: Update Homebrew formula
        id: formula
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.build-release.outputs.tag }}
        run: |
          set -euo pipefail

          version="${RELEASE_TAG#v}"
          tarball_url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${RELEASE_TAG}.tar.gz"
          tarball_path="$RUNNER_TEMP/${RELEASE_TAG}.tar.gz"
          branch="automation/homebrew-formula-${RELEASE_TAG}"

          curl -fsSL "$tarball_url" -o "$tarball_path"
          sha256="$(sha256sum "$tarball_path" | awk '{print $1}')"

          perl -0pi -e 's/version "[^"]+"/version "'"$version"'"/' Formula/szr.rb
          perl -0pi -e 's#url "https://github\.com/devr-tools/szr/archive/refs/tags/[^"]+\.tar\.gz"#url "'"$tarball_url"'"#' Formula/szr.rb
          perl -0pi -e 's/sha256 "[0-9a-f]+"/sha256 "'"$sha256"'"/' Formula/szr.rb

          echo "branch=$branch" >>"$GITHUB_OUTPUT"

          if git diff --quiet -- Formula/szr.rb; then
            echo "changed=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed=true" >>"$GITHUB_OUTPUT"

          git checkout -b "$branch"
          git config user.name "please-release"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/szr.rb
          git commit -m "chore(homebrew): update formula for ${RELEASE_TAG}"
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "tarball_url=$tarball_url" >>"$GITHUB_OUTPUT"
          echo "sha256=$sha256" >>"$GITHUB_OUTPUT"

      - name: Push formula update branch
        id: push_formula_branch
        if: steps.formula.outputs.changed == 'true' && steps.release_token.outputs.available == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          git push --force-with-lease origin "${{ steps.formula.outputs.branch }}"

      - name: Open formula update pull request
        id: open_formula_pr
        if: steps.formula.outputs.changed == 'true' && steps.release_token.outputs.available == 'true' && steps.push_formula_branch.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          RELEASE_TAG: ${{ needs.build-release.outputs.tag }}
          FORMULA_BRANCH: ${{ steps.formula.outputs.branch }}
        run: |
          set -euo pipefail

          title="chore(homebrew): update formula for ${RELEASE_TAG}"
          body=$(cat <<EOF
          ## Summary

          - update \`Formula/szr.rb\` to ${RELEASE_TAG}
          - pin the published source tarball checksum

          ## Verification

          - generated by \`.github/workflows/release.yml\` after the ${RELEASE_TAG} release completed
          EOF
          )

          existing="$(gh pr list --head "$FORMULA_BRANCH" --base "$DEFAULT_BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "$title" --body "$body"
          else
            gh pr create \
              --base "$DEFAULT_BRANCH" \
              --head "$FORMULA_BRANCH" \
              --title "$title" \
              --body "$body"
          fi

      - name: Record manual Homebrew follow-up
        if: steps.formula.outputs.changed == 'true' && (steps.release_token.outputs.available != 'true' || steps.push_formula_branch.outcome == 'failure' || steps.open_formula_pr.outcome == 'failure')
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.build-release.outputs.tag }}
          FORMULA_VERSION: ${{ steps.formula.outputs.version }}
          TARBALL_URL: ${{ steps.formula.outputs.tarball_url }}
          FORMULA_SHA256: ${{ steps.formula.outputs.sha256 }}
          FORMULA_BRANCH: ${{ steps.formula.outputs.branch }}
        run: |
          set -euo pipefail

          {
            echo "## Homebrew Formula Follow-up Required"
            echo
            if [ "${{ steps.release_token.outputs.available }}" != "true" ]; then
              echo "- Automated PR was skipped because \`RELEASE_PLEASE_TOKEN\` is not configured."
            elif [ "${{ steps.push_formula_branch.outcome }}" = "failure" ]; then
              echo "- Automated PR was skipped because pushing branch \`$FORMULA_BRANCH\` failed."
            elif [ "${{ steps.open_formula_pr.outcome }}" = "failure" ]; then
              echo "- Automated PR was skipped because PR creation or update failed."
            fi
            echo
            echo "Apply this update manually:"
            echo
            echo "- File: \`Formula/szr.rb\`"
            echo "- Version: \`$FORMULA_VERSION\`"
            echo "- Tag: \`$RELEASE_TAG\`"
            echo "- Tarball: \`$TARBALL_URL\`"
            echo "- SHA256: \`$FORMULA_SHA256\`"
            echo "- Suggested branch: \`$FORMULA_BRANCH\`"
          } >>"$GITHUB_STEP_SUMMARY"
